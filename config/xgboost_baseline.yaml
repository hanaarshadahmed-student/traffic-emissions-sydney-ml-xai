# XGBoost validation baseline using the same daily rows, feature sets,
# target, chronological split, and sample weights as the other models.

pipeline:
  stage: models

grain: daily
feature_sets:
  - exogenous
  - autoregressive
  - all
split: val

models:
  xgboost:
    enabled: true
    params:
      objective: reg:squarederror
      n_estimators: 500
      learning_rate: 0.03
      max_depth: 4
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      tree_method: hist
      eval_metric: rmse
      n_jobs: -1
      random_state: 42
