# Main project config -- edit this file, not the code, for ordinary
# experimentation. Then run:   python run_pipeline.py
#
# As set here, `python run_pipeline.py` runs EVERYTHING the report needs:
# both grains, all methods, tuning and the evaluation tables. To run less
# for a one-off, use command-line options instead of editing this file:
#   --stage <name>   --grain daily|hourly   --models ridge lstm ...   --no-tune
#
# Search spaces for hyperparameter tuning live in config/tuning.yaml.

# ---------------------------------------------------------------------------
# pipeline -- which stage(s) run_pipeline.py runs
# ---------------------------------------------------------------------------
#   all         every stage in order: ingest -> clean -> preprocess ->
#               features -> split -> train -> (tune) -> evaluate.
#               Empties data/processed/ first so a run never mixes with a
#               stale one. results/ is kept (results.json is a cross-run log).
#   <stage>     just that one stage, reusing what's already on disk:
#               ingest | clean | preprocess | features | split | train | tune | evaluate | explain
#
# `--stage <name>` on the command line overrides this for a one-off.
pipeline:
  stage: all
  run_tuning: true    # `stage: all` includes the (slow) tune stage; --no-tune skips it
  jobs: auto          # models trained at the same time: a number, or auto =
                      # one per 4 CPU cores (max 4). 1 = one at a time.
  save_run: true      # save results + this config + log to results/runs/<run_id>/
                      # whenever train/tune/evaluate runs (see scripts/run_record.py)

# ---------------------------------------------------------------------------
# data -- station exclusions applied in 02_cleaning.py
# ---------------------------------------------------------------------------
# MAIN ANALYSIS:        enabled: true   (the stations below are left out)
# SENSITIVITY ANALYSIS: enabled: false  (everything kept) -- re-run
#                       `python run_pipeline.py --stage all` and compare,
#                       to show the conclusions don't hinge on this choice.
#
# Rule (applied to every AQ site, stated in the report): an AQ site is
# excluded if its same-quarter NO2 mean changes more than 3-fold
# year-on-year with no corresponding change in traffic at the matched
# stations -- i.e. the target is not reflecting traffic emissions.
# Only PORT MACQUARIE meets it (NO2 ~8x higher in Q1 2025 than Q1 2024,
# ~5.6x in Q2, back down by Q4 2025; traffic flat). Supporting reasons:
# the monitor is 37 km / 87 km from these stations, far beyond the
# ~160-570 m over which traffic NO2 decays to background (Karner,
# Eisinger & Niemeier 2010). This rule was set after inspecting the
# data, which is why the sensitivity analysis is reported alongside.
data:
  station_exclusions:
    enabled: true
    stations:
      "6124": "PORT MACQUARIE AQ site: >3x year-on-year NO2 shift unrelated to traffic; 36.9 km from monitor"
      "6119-PR": "PORT MACQUARIE AQ site: >3x year-on-year NO2 shift unrelated to traffic; 87.3 km from monitor"

# ---------------------------------------------------------------------------
# training -- what 06_run_models.py trains and how it's scored
# ---------------------------------------------------------------------------
# grain:          [daily, hourly] for both (default), or just one
# feature_sets:   which feature_manifest.json feature sets to train on,
#                 one run each:
#                   exogenous       traffic/weather/calendar/road/station
#                                   only (no NO2 history)
#                   autoregressive  only NO2's own lag/rolling features
#                   all             everything combined
# split:          the split used for choosing between models -- keep "val"
#                 while iterating; test is reported, never tuned on
# report_splits:  every split each fitted model is scored on
training:
  grain: [daily, hourly]
  feature_sets:
    - exogenous
    - autoregressive
    - all
  split: val
  report_splits: [train, val, test]

  # -------------------------------------------------------------------------
  # A. BASELINE METHODS (not ML) -- simple rules that learn nothing from the
  #    features; the minimum score every ML model has to beat.
  # -------------------------------------------------------------------------
  baselines:
    naive_persistence: true            # B1: NO2 = the last observed value
    naive_seasonal_climatology: true   # B2: station's train average for that month (+ hour)

  # -------------------------------------------------------------------------
  # B. ML MODELS -- names must match scripts/models.py; enabled: false skips
  #    one. `grains: [daily]` limits a model to some grains (else: all).
  # -------------------------------------------------------------------------
  models:
    # 1. Ridge -- linear model; also a diagnostic (see scripts/models.py)
    ridge:
      enabled: true
      params:
        alpha: 1.0
        random_state: 42

    # 2. Decision tree
    decision_tree:
      enabled: true
      params:
        max_depth: 8
        min_samples_leaf: 5
        random_state: 42

    # 3. Random forest
    random_forest:
      enabled: true
      params:
        n_estimators: 300
        max_depth: null
        min_samples_leaf: 5
        n_jobs: -1
        random_state: 42

    # 4. XGBoost
    xgboost:
      enabled: true
      params:
        objective: reg:squarederror
        n_estimators: 500
        learning_rate: 0.03
        max_depth: 4
        min_child_weight: 5
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.0
        reg_lambda: 1.0
        tree_method: hist
        eval_metric: rmse
        n_jobs: -1
        random_state: 42

    # 5. SVR -- daily only: kernel SVR is far too slow on ~47k hourly rows
    svr:
      enabled: true
      grains: [daily]
      params:
        kernel: rbf
        C: 1.0
        epsilon: 0.1
        gamma: scale
        cache_size: 2048

    # 6. LSTM -- recurrent neural network over the last `seq_len` time steps
    #    (scripts/lstm.py; needs PyTorch). Same features and rows as the
    #    other models; early-stops on the validation split.
    lstm:
      enabled: true
      params:
        seq_len: {daily: 14, hourly: 24}   # history window: 14 days / 24 hours
        hidden_size: 64
        num_layers: 1
        dropout: 0.1
        learning_rate: 0.001
        weight_decay: 0.0
        batch_size: 256
        max_epochs: 30
        patience: 5          # stop after this many epochs without val improvement
        random_state: 42

    # 7. GRU -- lighter recurrent alternative to LSTM for hourly sequences
    gru:
      enabled: true
      grains: [hourly]
      params:
        seq_len: {hourly: 24}
        hidden_size: 64
        num_layers: 1
        dropout: 0.1
        learning_rate: 0.001
        weight_decay: 0.0
        batch_size: 256
        max_epochs: 30
        patience: 5
        gradient_clip: 1.0
        num_threads: 1
        random_state: 42

# ---------------------------------------------------------------------------
# explainability -- SHAP on the XGBoost model (stage 08, results/shap/)
# ---------------------------------------------------------------------------
# Uses the tuned XGBoost saved by the tune stage (or refits the default one if
# there isn't one). Runs for the grains in training.grain.
explainability:
  enabled: true
  feature_sets: [all, exogenous]   # all = best forecaster; exogenous = what external factors drive NO2
  split: test                      # rows to explain: train | val | test
  max_rows: 5000                   # random sample size (more = slower, smoother plots)
  top_features: 15                 # features shown in the summary / bar plots
  dependence_plots: 4              # one effect-vs-value plot for each of the top N features
