grains:
  - daily
  - hourly

feature_sets:
  - exogenous
  - autoregressive
  - all

split: val
selection_metric: rmse
n_trials: 12
random_state: 42

fixed_params:
  objective: reg:squarederror
  min_child_weight: 5
  reg_alpha: 0.0
  reg_lambda: 1.0
  tree_method: hist
  eval_metric: rmse
  n_jobs: -1

baseline_params:
  n_estimators: 500
  learning_rate: 0.03
  max_depth: 4
  subsample: 0.8
  colsample_bytree: 0.8

search_space:
  n_estimators:
    - 300
    - 500
    - 800
  learning_rate:
    - 0.02
    - 0.03
    - 0.05
    - 0.08
  max_depth:
    - 3
    - 4
    - 6
  subsample:
    - 0.7
    - 0.85
    - 1.0
  colsample_bytree:
    - 0.7
    - 0.85
    - 1.0
