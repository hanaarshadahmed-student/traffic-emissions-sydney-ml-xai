# Which models to run, and with what settings -- edit this file, not the
# code, for ordinary experimentation (turning a model on/off, changing a
# hyperparameter, switching grain or feature set).
#
# random_forest, decision_tree, and ridge are enabled by default.
# SVR and XGBoost are also available with dedicated tuning configurations.
#
# grain:         "daily" or "hourly"
# feature_sets:  which feature_manifest.json feature sets to train+evaluate
#                on, one run each:
#                  - exogenous       traffic/weather/calendar/road/station
#                                    only (no NO2 history)
#                  - autoregressive  only NO2's own lag/rolling features
#                  - all             everything combined
# split:         which split to evaluate on -- "val" while iterating,
#                switch to "test" only once for the final reported numbers
#
# pipeline.stage: which stage(s) src/run_pipeline.py runs, in order:
#     ingest | eda | preprocess | features | split | models
#     (== 01_data_ingestion, 02_eda, 03_data_preprocessing,
#         04_feature_engineering, 05_train_test_split, 06_run_models)
#
#   stage: all       run every stage 01 -> 06, wiping data/processed/
#                    first so this run never mixes with a stale one
#                    (the model_results/ log is left alone)
#   stage: <name>    run just that one stage, reusing whatever's
#                    already on disk from the previous stage -- e.g.
#                    "models" to just retrain/re-evaluate once
#                    everything through 05 is already built

pipeline:
  stage: models   # all | ingest | eda | preprocess | features | split | models

grain: daily
feature_sets:
  - exogenous
  - autoregressive
  - all
split: val
report_splits: [train, val, test]   # every split each fitted model is scored on
baselines: true   # also score naive persistence + seasonal-climatology baselines

models:
  random_forest:
    enabled: true
    params:
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 5
      n_jobs: -1
      random_state: 42

  decision_tree:
    enabled: true
    params:
      max_depth: 8
      min_samples_leaf: 5
      random_state: 42

  ridge:
    enabled: true
    params:
      alpha: 1.0
      random_state: 42
    # Diagnostic baseline, not a competitor for the final model choice
    # -- see models/ridge.py docstring for why it's here: comparing it
    # against the trees on "exogenous" tells you whether that feature
    # set's negative R2 is a real lack-of-signal problem or a
    # tree-overfitting problem.

  xgboost:
    enabled: false
    params:
      objective: reg:squarederror
      n_estimators: 500
      learning_rate: 0.03
      max_depth: 4
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      tree_method: hist
      eval_metric: rmse
      n_jobs: -1
      random_state: 42

  svr:
    enabled: false
    params:
      kernel: rbf
      C: 1.0
      epsilon: 0.1
      gamma: scale
      cache_size: 2048